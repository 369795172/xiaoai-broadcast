[project]
name = "xiaoai-broadcast"
version = "0.1.0"
description = "Lean XiaoAi ( Xiaomi ) speaker broadcaster: MiNA cloud API push + local audio file server. No WebUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvin" }]
dependencies = [
    "miservice-fork>=2.9",
    "aiohttp>=3.9",
]

[project.scripts]
xiaoai-broadcast = "xiaoai_broadcast.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xiaoai_broadcast*"]
